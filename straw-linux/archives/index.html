<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straw Linux - Package Archives</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 25px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #58a6ff;
        }
        .package-list {
            display: grid;
            gap: 15px;
        }
        .package-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        .package-card:hover {
            border-color: #8b949e;
        }
        .pkg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .pkg-name {
            font-size: 18px;
            font-weight: bold;
            color: #58a6ff;
            text-decoration: none;
        }
        .pkg-name:hover {
            text-decoration: underline;
        }
        .pkg-version {
            background: #30363d;
            color: #c9d1d9;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .pkg-desc {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .pkg-command {
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: #7ee787;
            border: 1px solid #30363d;
            display: inline-block;
        }
        .no-results {
            text-align: center;
            color: #8b949e;
            padding: 40px;
            display: none;
        }
        .loading {
            text-align: center;
            color: #8b949e;
            font-size: 16px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Package Archives</h1>
        <div class="subtitle">Official software repository for Straw Linux (aarch64)</div>

        <input type="text" id="searchInput" class="search-box" placeholder="Search packages..." onkeyup="filterPackages()">

        <div id="loading" class="loading">Fetching packages from repository...</div>
        <div id="packageList" class="package-list"></div>

        <div id="noResults" class="no-results">No packages found matching your search.</div>
    </div>

    <script>
        // إعدادات مستودع الجيت هاب الخاص بك
        const username = 'VoidCoderStudio';
        const repo = 'VoidCoderStudio.github.io'; // اسم المستودع الخاص بك على جيت هاب
        const folderPath = 'straw-root/stable/aarch64'; // مسار المجلد الذي يحتوي الحزم

        // رابط مصفوفة الجيت هاب البرمجية (GitHub API) لقراءة الملفات
        const apiUrl = `https://github.com{username}/${repo}/contents/${folderPath}`;

        // دالة جلب البيانات من جيت هاب وعرضها
        async function fetchPackages() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch repository contents');
                
                const files = await response.json();
                const packageListDiv = document.getElementById('packageList');
                document.getElementById('loading').style.display = 'none';

                // تصفية الملفات للحصول على الحزم المضغوطة فقط (مثل .tar.gz أو .tar.xz)
                const packageFiles = files.filter(file => file.type === 'file' && (file.name.endsWith('.tar.gz') || file.name.endsWith('.tar.xz')));

                if (packageFiles.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                    document.getElementById('noResults').innerText = 'No package files found in this directory.';
                    return;
                }

                packageFiles.forEach(file => {
                    // 1. تنظيف اسم الحزمة وحذف الامتدادات مثل .tar.gz أو .tar.xz
                    let rawName = file.name;
                    let cleanName = rawName.replace('.tar.gz', '').replace('.tar.xz', '');
                    
                    // 2. تحديد أمر التشغيل تلقائياً (إذا كان نظام يعطيه pkg update، وباقي الحزم pkg install)
                    let command = `pkg install ${cleanName}`;
                    if (cleanName.toLowerCase() === 'system') {
                        command = 'pkg update';
                    }

                    // 3. بناء الكارت الخاص بالحزمة ديناميكياً داخل الصفحة
                    const card = document.createElement('div');
                    card.className = 'package-card';
                    card.setAttribute('data-name', cleanName);
                    card.innerHTML = `
                        <div class="pkg-header">
                            <a href="${file.download_url}" class="pkg-name" target="_blank">${cleanName}</a>
                            <span class="pkg-version">Stable</span>
                        </div>
                        <div class="pkg-desc">Official binary package for Straw Linux aarch64. File: ${rawName}</div>
                        <div class="pkg-command">${command}</div>
                    `;
                    packageListDiv.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
                document.getElementById('noResults').innerText = 'Error loading packages. Please check repository configurations.';
            }
        }

        // دالة الفلترة والبحث التي كتبتها أنت مسبقاً
        function filterPackages() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('package-card');
            let visibleCount = 0;

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                let desc = cards[i].innerText.toLowerCase();
                if (name.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "block";
                    visibleCount++;
                } else {
                    cards[i].style.display = "none";
                }
            }

            document.getElementById('noResults').style.display = visibleCount === 0 ? "block" : "none";
        }

        // تشغيل الدالة فور فتح الصفحة
        fetchPackages();
    </script>

</body>
</html>
