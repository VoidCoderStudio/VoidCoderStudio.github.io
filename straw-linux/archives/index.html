<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straw Linux - Package Archives</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 25px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #58a6ff;
        }
        .package-list {
            display: grid;
            gap: 15px;
        }
        .package-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        .package-card:hover {
            border-color: #8b949e;
        }
        .pkg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .pkg-name {
            font-size: 18px;
            font-weight: bold;
            color: #58a6ff;
            text-decoration: none;
        }
        .pkg-name:hover {
            text-decoration: underline;
        }
        .pkg-version {
            background: #30363d;
            color: #c9d1d9;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .pkg-desc {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .pkg-command {
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: #7ee787;
            border: 1px solid #30363d;
            display: inline-block;
        }
        .no-results {
            text-align: center;
            color: #8b949e;
            padding: 40px;
            display: none;
        }
        .loading {
            text-align: center;
            color: #8b949e;
            font-size: 16px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Package Archives</h1>
        <div class="subtitle">Official software repository for Straw Linux</div>

        <input type="text" id="searchInput" class="search-box" placeholder="Search packages (e.g. system, fastfetch, nano)..." onkeyup="filterPackages()">

        <div id="loading" class="loading">Loading live packages from archive...</div>
        <div id="packageList" class="package-list"></div>

        <div id="noResults" class="no-results">No packages found matching your search.</div>
    </div>

    <script>
        // الرابط المباشر للمجلد الخاص بك كما طلبته تماماً
        const baseArchiveUrl = "https://VoidCoderStudio.github.io/straw-root/stable/aarch64/";

        // تحويل الرابط تلقائياً إلى صيغة الـ API الخاصة بـ GitHub لقراءة أسماء الحزم بداخل المجلد
        const apiTargetUrl = "https://github.com";

        async function loadArchivePackages() {
            try {
                const response = await fetch(apiTargetUrl);
                if (!response.ok) throw new Error('Cannot access raw repository directory');
                
                const files = await response.json();
                const packageListDiv = document.getElementById('packageList');
                document.getElementById('loading').style.display = 'none';

                // تصفية الملفات لالتقاط الإمتدادات المدعومة في الأرشيف الخاص بك
                const archiveFiles = files.filter(file => file.type === 'file' && (file.name.endsWith('.tar.gz') || file.name.endsWith('.tar.xz') || file.name.endsWith('.tar')));

                if (archiveFiles.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                    document.getElementById('noResults').innerText = 'The archive directory is currently empty.';
                    return;
                }

                archiveFiles.forEach(file => {
                    // 1. استخراج اسم الحزمة الأصلي وحذف الإمتدادات تنفيذاً لطلبك
                    let rawFileName = file.name;
                    let cleanPkgName = rawFileName.replace('.tar.gz', '').replace('.tar.xz', '').replace('.tar', '');
                    
                    // 2. تخصيص أمر التشغيل تلقائياً (pkg update لحزمة الـ system، و pkg install للبقية)
                    let runCommand = `pkg install ${cleanPkgName}`;
                    let descriptionText = `Official software package for Straw Linux. compiled binary archive.`;
                    
                    if (cleanPkgName.toLowerCase() === 'system') {
                        runCommand = 'pkg update';
                        descriptionText = 'Core system binaries, kernel components, and file system updates.';
                    }

                    // الرابط المباشر للتحميل من مجلد الـ stable/aarch64
                    let fileDownloadLink = baseArchiveUrl + rawFileName;

                    // 3. بناء كارت الحزمة وعرضه في الواجهة ديناميكياً
                    const card = document.createElement('div');
                    card.className = 'package-card';
                    card.setAttribute('data-name', cleanPkgName);
                    card.innerHTML = `
                        <div class="pkg-header">
                            <a href="${fileDownloadLink}" class="pkg-name" target="_blank">${cleanPkgName}</a>
                            <span class="pkg-version">aarch64</span>
                        </div>
                        <div class="pkg-desc">${descriptionText} <br><small style="color: #6e7681;">File: ${rawFileName}</small></div>
                        <div class="pkg-command">${runCommand}</div>
                    `;
                    packageListDiv.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
                document.getElementById('noResults').innerText = 'Error reading file index from the stable aarch64 server.';
            }
        }

        // دالة الفلترة والبحث الفوري في الكروت المكتشفة
        function filterPackages() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('package-card');
            let visibleCount = 0;

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                let desc = cards[i].innerText.toLowerCase();
                if (name.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "block";
                    visibleCount++;
                } else {
                    cards[i].style.display = "none";
                }
            }

            document.getElementById('noResults').style.display = visibleCount === 0 ? "block" : "none";
        }

        // تشغيل كاشف الأرشيف فور إقلاع الصفحة
        loadArchivePackages();
    </script>

</body>
</html>
